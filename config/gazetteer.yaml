# City gazetteer for location resolution.
#
# The source `City` column holds 417 distinct values across 1,917 non-null rows, 259 of which
# appear exactly once. It was clearly sliced out of a free-text postal address, so alongside real
# cities it contains address fragments ("Nagar" x24, "Road" x9, "Colony" x7, "Vihar", "Marg",
# "Block", "Floor", "Enclave") and outright non-places ("PNB", "Dental Hospital", "Diagnostics",
# "Farm", "quality", "today").
#
# Resolution policy:
#   exact city match      -> confidence 1.00
#   alias match           -> confidence 0.90
#   state / region match  -> confidence 0.50, coarse granularity only
#   address fragment      -> unresolved, confidence 0.00, validation issue raised
#   anything else         -> unresolved, confidence 0.00, kept verbatim in leads.location_raw
#
# Unresolved is a first-class outcome. Guessing a city from a fragment would manufacture
# geographic precision the source data does not have.

version: "1.0"
country_code: IN

