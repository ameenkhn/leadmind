# Controlled vertical taxonomy.
#
# The source carries two incompatible category systems:
#   * `FB_Category` — Facebook's own taxonomy, 275 distinct values across the three sheets,
#     long-tailed (161 of them appear once or twice) and inconsistent in granularity
#     ("Education" sits beside "Paediatric dentist").
#   * `Day_1.Niche` — five curated verticals, present on 900 rows only.
#
# Neither is usable as a feature directly: a one-hot over 275 sparse labels is noise, and the
# curated column covers 36% of the file. This map collapses both into 15 verticals that are
# stable enough to score against and specific enough to matter for an ICP.
#
# Unmapped values resolve to `unclassified` rather than being guessed at. `unclassified` is a
# legitimate outcome that lowers data-quality confidence; it is not a silent default.

