[project]
name = "leadmind"
version = "0.1.0"
description = "AI Lead Intelligence & Qualification Engine"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.10.0",
    "phonenumbers>=8.13.50",
    "email-validator>=2.2.0",
    "tldextract>=5.1.3",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
    "dnspython>=2.7.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.3",
    "types-pyyaml>=6.0.12",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
leadmind = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "TID"]
ignore = [
    "B008",
    # Prose in docstrings and comments deliberately uses en/em dashes.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ARG"]
"backend/app/db/migrations/**" = ["N999", "E501", "UP035", "UP007", "I001", "RUF100"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
packages = ["app"]
plugins = []
exclude = ["backend/app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tldextract.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL database",
    "golden: full-dataset reconciliation test",
    "network: needs outbound DNS or HTTP; skipped where egress is blocked",
]
